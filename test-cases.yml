  expected-result: |
    Должна открыться мобильная версия сайта, дизайн и содержание оптимизированы под просмотр с мобильных устройств

- summary: | 
    Проверка корректности работы сайта на различных устройствах
  requirement: |
    Сайт должен быть доступен на различных устройствах
  prerequisites:
    Открыта страница проекта, открыт "DevTools"
  test-data: |
    Страница проекта, в "Toggle device toolbar" включен режим эмуляции экранов с разрешением экрана 360 × 800 px, 375 × 812 px, 390 × 844 px, 414 × 896 px, 768 × 1024 px, 800 × 1280 px, 1920 × 1080 px, 1366 × 768 px, 1440 × 900 px, 2560 × 1440 px 
  steps:
    - Щелкнуть по “Create a battle”
    - В настройках игры выбрать “With a bot”
    - В меню “Choose task by name or tags” ввести значение “age_to_days”, выбрать единственный найденный вариант игры
    - Щелкнуть по "Create battle"
    - В меню выбора языка программирования выбрать “Python 3.14.5”
    - В поле с решением в строку 4 ввести текст “ans = age*365”
    - Нажать “Run”
  expected-result: |
    На всех проверенных моделях мобильных устройств и типовых разрешениях экранов сайт проекта отображается корректно
    
- summary: | 
    Проверка корректности работы сайта в последних версиях разных браузеров
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров.
