  steps:
    - Щелкнуть по "Create a battle”
    - В настройках игры выбрать “With a bot”
    - В меню “Choose task by name or tags” ввести значение “age_to_days”, выбрать единственный найденный вариант игры
    - Щелкнуть по "Create battle"
    - В меню выбора языка программирования выбрать “Python 3.14.5”
    - В поле с решением в строку 4 ввести текст “ans = age*365”
    - Нажать “Run”
  expected-result: |
    Во всех протестированных браузерах сайт отобразился корректно  

- summary: | 
    Проверка оптимизации работы сайта при низкой скорости интернет-соединения
  requirement: |
    Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  prerequisites:
    Открыта страница проекта
  test-data: |
    Страница проекта
  steps:
    - Открыть "DevTools"
    - Перейти на вкладку "Network"
    - Установить скорость соединения "3G"
    - Перезагрузить страницу
  expected-result: |
    Загрузка сайта должна осуществиться поэтапно - сначала должна загрузиться общая структура сайта, потом должны загрузиться кнопки, отвечающие за общую функциональность сайта (создание игры), второстепенные элементы (чат, рейтинг, информация о пользователях на сайте) должны загружаться в последнюю очередь. При долгом отклике от сервера пользователю должно отображаться сообщение, в явном виде указывающее на необходимость дождаться загрузки сайта. 
  
